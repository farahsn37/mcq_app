<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quiz Application</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    >
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow">
                    <div class="card-body p-5 text-center">

                        <h1 class="mb-3">Quiz Application</h1>

                        <p class="text-muted mb-4">
                            Test your knowledge by choosing a quiz category.
                            Each quiz contains five multiple-choice questions.
                        </p>

                        <form action="{{ url_for('quiz') }}" method="GET">

                            <div class="form-group text-left">
                                <label for="category">
                                    <strong>Select Quiz Category</strong>
                                </label>

                                <select
                                    class="form-control"
                                    id="category"
                                    name="category"
                                    required
                                >
                                    <option value="" selected>
                                        All Categories
                                    </option>

                                    <option value="9">
                                        General Knowledge
                                    </option>

                                    <option value="18">
                                        Technology & Computers
                                    </option>

                                    <option value="17">
                                        Science & Nature
                                    </option>

                                    <option value="19">
                                        Mathematics
                                    </option>

                                    <option value="23">
                                        History
                                    </option>

                                    <option value="22">
                                        Geography
                                    </option>

                                    <option value="21">
                                        Sports
                                    </option>

                                    <option value="15">
                                        Video Games
                                    </option>

                                    <option value="11">
                                        Film
                                    </option>

                                    <option value="12">
                                        Music
                                    </option>

                                    <option value="27">
                                        Animals
                                    </option>

                                    <option value="20">
                                        Mythology
                                    </option>
                                </select>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg btn-block"
                            >
                                Start Quiz
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
