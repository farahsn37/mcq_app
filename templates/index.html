<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCQ Quiz - Home</title>

    <!-- Bootstrap 4.5 CSS CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand" href="/">MCQ Quiz Application</a>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow">
                    <div class="card-body text-center p-5">

                        <h1 class="mb-3">Welcome to the MCQ Quiz!</h1>

                        <p class="lead">
                            Test your programming knowledge with our quiz.
                        </p>

                        <hr>

                        <p>
                            This quiz contains one multiple-choice question
                            with four answer options.
                        </p>

                        <p>
                            Select your answer carefully and submit it to
                            see your result.
                        </p>

                        <!-- Start Quiz Button -->
                        <a href="{{ url_for('quiz') }}"
                           class="btn btn-primary btn-lg mt-3">
                            Start Quiz
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 4.5 JavaScript CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
